<!doctype html>
<html lang="es" class="sin-sesion">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='38%25' cy='34%25' r='70%25'%3E%3Cstop offset='0' stop-color='%23FFE9A3'/%3E%3Cstop offset='.4' stop-color='%23FFA51F'/%3E%3Cstop offset='.8' stop-color='%23FF5A1F'/%3E%3Cstop offset='1' stop-color='%23E0262E'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preload" href="/office/marca/archivo.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/office/marca/space-grotesk.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/office/oficina.css">
</head>
<body>
  <main class="oficina" aria-label="Agent Office: edificio de agentes">
    <canvas class="capa escena" aria-hidden="true"></canvas>
    <div class="capa rotulos" role="list" aria-label="Puestos"></div>
  </main>

  <div class="velo arriba" aria-hidden="true"></div>
  <div class="velo abajo" aria-hidden="true"></div>

  <header class="cabeza">
    <h1>Agent Office</h1>
    <p class="resumen" aria-live="polite"></p>
  </header>

  <div class="tema" role="radiogroup" aria-label="Luz">
    <button type="button" role="radio" data-tema="dia" aria-checked="true">Día</button>
    <button type="button" role="radio" data-tema="noche" aria-checked="false">Noche</button>
  </div>

  <nav class="plantas" aria-label="Plantas"></nav>

  <aside class="actividad" aria-label="Activity Center">
    <header>
      <h2>Actividad</h2>
      <span class="conexion" aria-live="polite">conectando…</span>
      <a class="boton-chat" href="/chat">Chat completo</a>
      <button type="button" class="expandir" aria-expanded="false" title="Ampliar el panel">⤢</button>
      <button type="button" class="plegar" title="Plegar el panel">–</button>
    </header>
    <div class="filtros">
      <select name="categoria" aria-label="Tipo"><option value="">Todos los tipos</option></select>
      <select name="agente" aria-label="Agente" data-todos="Todos los agentes"><option value="">Todos los agentes</option></select>
      <select name="propietario" aria-label="Propietario" data-todos="Todos los propietarios"><option value="">Todos los propietarios</option></select>
      <input name="tarea" inputmode="numeric" placeholder="Tarea #" aria-label="Filtrar por tarea">
      <label><input type="checkbox" name="sistema" checked> sistema</label>
      <span class="cuenta"></span>
    </div>
    <ol class="tarjetas" aria-live="polite"></ol>
  </aside>

  <form id="acceso" class="acceso" hidden>
    <h2>Agent Office</h2>
    <p>Acceso con token (rol <code>monitor</code>, <code>member</code> o <code>admin</code>). Se guarda solo en esta pestaña.</p>
    <input id="acceso-token" type="password" autocomplete="off" spellcheck="false" placeholder="al_…" required>
    <button type="submit">Entrar</button>
    <p id="acceso-error" class="error" role="alert"></p>
  </form>

  <div class="zoom" role="group" aria-label="Acercar y alejar">
    <button type="button" class="todo" data-zoom="todo">Todo el edificio</button>
    <div class="par">
      <button type="button" data-zoom="mas" aria-label="Acercar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
      <button type="button" data-zoom="menos" aria-label="Alejar"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg></button>
    </div>
  </div>

  <script type="module" src="/office/oficina.js"></script>
</body>
</html>
