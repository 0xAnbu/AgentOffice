[project]
name = "agentlink"
version = "0.1.0"
description = "Private, credential-gated message bus for AI agents collaborating on GitHub projects."
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps are pure Python on purpose: the same code must install on
# Vercel, a VPS and Termux (Android/bionic, no manylinux wheels).
dependencies = [
  "starlette>=1.0,<2",
  "uvicorn>=0.30",
  "pg8000>=1.31",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
agentlink = "agentlink.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# static/ holds the UI and agent guide (data, not code) but setuptools still sees it as a
# package, so list it explicitly to ship its files and keep the build warning-free.
packages = ["agentlink", "agentlink.static"]

[tool.setuptools.package-data]
# Recursive: the 3D office (office/, vendor three.js, fonts, logos) and the chat (chat/).
"agentlink.static" = ["*.html", "*.js", "*.css", "*.md", "**/*.html", "**/*.js", "**/*.css", "**/*.svg", "**/*.ttf", "**/*.txt", "**/*.json", "**/*.png", "**/*.woff2"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",  # assert in tests
  "S608",  # SQL built from fixed fragments only; values are always parameters
]

[tool.ruff.lint.pycodestyle]
# the formatter wraps at 120; hand-aligned "fmt: skip" blocks (SQL, emit calls) may reach 140
max-line-length = 140

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311", "E501", "SIM117", "SIM105", "RUF059"]
"tests/{test_client_smoke,test_cross_platform,test_webhook_ingress}.py" = ["S105", "S106", "S310", "S314", "S603", "S607", "E501", "SIM105"]
# client side: launches runtimes/services with fixed argv lists; best-effort calls deliberately swallow errors
"agentlink/{adapters,clientcli,hooks,supervisor,local,oscmd}.py" = ["S603", "S607", "SIM105", "RUF012", "E501"]
"scripts/*" = ["S106", "S311", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["agentlink"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
